name: belive
description: "Unilive - Live Streaming & Social App"
publish_to: 'none'
version: 1.0.7+75

environment:
  sdk: ^3.7.0
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Core
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5
  url_launcher: ^6.3.2
  connectivity_plus: ^6.1.5
  device_info_plus: ^11.5.0
  package_info_plus: ^9.0.0
  permission_handler: ^11.4.0

  # Networking
  dio: ^5.10.0
  socket_io_client: ^2.0.3+1

  # Firebase
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  firebase_messaging: ^15.2.10

  # Auth
  google_sign_in: ^6.3.0
  country_picker: ^2.0.28
  pinput: ^5.0.2

  # UI / Widgets
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17
  fluttertoast: ^8.2.14
  shimmer: ^3.0.0
  lottie: ^3.1.0
  pull_to_refresh: ^2.0.0
  go_router: ^14.8.1

  # Media
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  image_cropper: ^8.0.2
  image: ^4.5.2
  video_player: ^2.9.2
  chewie: ^1.8.5
  just_audio: ^0.9.43
  audio_waveforms: ^1.0.5
  file_picker: ^8.1.2
  # Device audio library scanner (folders, album art, duration, artist)
  on_audio_query: ^2.9.0
  google_mlkit_face_detection: ^0.13.0
  google_mlkit_text_recognition: 0.15.0

  # Storage & Cache
  flutter_cache_manager: ^3.4.1

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Sharing
  share_plus: ^10.1.4
  app_links: ^6.4.1

  # In-App Purchase
  in_app_purchase: 3.2.3

  # Agora Live Streaming
  agora_rtc_engine: ^6.5.4

  # WebView
  webview_flutter: ^4.10.0

  # Models
  json_annotation: ^4.9.0
  agora_token_generator: ^1.0.0

  # Utilities
  intl: ^0.19.0

  # SVGA animations — svgaplayer_3 is the maintained fork of the archived
  # svgaplayer_flutter package and fixes transparent-background / alpha issues.
  svgaplayer_3: ^3.0.1
  archive: ^4.0.0
  video_thumbnail: ^0.5.6
  geolocator: ^14.0.2

  # Audio & Power
  wakelock_plus: ^1.2.8
  audio_session: ^0.1.21
  flutter_foreground_task: ^8.10.0

  # Charts
  fl_chart: ^1.1.0

  # QR code generation for profile sharing
  qr_flutter: ^4.1.0

  # Ads
  google_mobile_ads: ^5.3.0
  in_app_update: ^4.2.5
dependency_overrides:
  http: ^1.2.2
  archive: ^4.0.0
  vector_math: 2.2.0
  meta: ^1.17.0
  device_info_plus: ^12.2.0
  # Patched fluttertoast: suppresses the "setGravity() shouldn't be called on text toasts"
  # framework error and the internal KARTHIK debug log on Android 11+.
  fluttertoast:
    path: packages/fluttertoast
  # Patched cached_network_image: adds a fallback decoder so GIF/WEBP/odd
  # formats that crash the native Vivo ImageDecoder are re-encoded as PNG
  # via the pure-Dart `image` package. No call-site changes needed.
  cached_network_image:
    path: packages/cached_network_image
  connectivity_plus: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/logo/
    - assets/images/
    - assets/pk_live/
    - assets/icon/
    - assets/vip/
    - assets/cp_friend/
    - assets/videos/
    - assets/gift/
    - assets/sounds/
    - assets/mic_wave/
    - assets/profile _room_card/
    - assets/family/
    - assets/call/
    - assets/lucky/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/unilive_logo_app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/unilive_logo.png"
  adaptive_icon_foreground_inset: 22
  min_sdk_android: 23
