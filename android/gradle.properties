# NOTE: org.gradle.jvmargs is IGNORED when the daemon is disabled — the build
# then runs in the wrapper's client JVM (default ~512MB heap), which is what
# caused D8 mergeExtDexDebug to OOM. Daemon must stay enabled for this to apply.
# Machine has 24GB RAM; 10GB heap is safe and enough for dex merging.
org.gradle.jvmargs=-Xmx10240m -Xms2048m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC -Djava.net.preferIPv4Stack=true -Dhttps.protocols=TLSv1.2 -Djdk.tls.client.protocols=TLSv1.2
org.gradle.daemon=true
org.gradle.vfs.watch=false
org.gradle.parallel=false
org.gradle.workers.max=1
android.useAndroidX=true
# Disable artifact transform-based dexing - use task-based dexing instead
android.experimental.dexing.enableDexingArtifactTransform=false
# Disable Kotlin incremental compilation — required because the pub cache
# lives on C: and the project on E:, and the Kotlin incremental compiler
# cannot compute relative paths across different Windows drive roots.
kotlin.incremental=false
# Allow duplicate manifest namespaces (Agora SDK has iris-rtc + agora-special-full
# both using io.agora.rtc namespace).
android.uniquePackageNames=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# JDK 21 path for Gradle
org.gradle.java.home=C:/jdk21/jdk-21.0.5+11
